# Streamlit theme for the LuxStats portal — calm, trustworthy, public-facing.
[theme]
primaryColor = "#1f6f8b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a2230"
font = "sans serif"

[client]
showErrorDetails = true
# LuxStats ships its own compact navigation in src/ui/navigation.py.
showSidebarNavigation = false

[server]
headless = true
